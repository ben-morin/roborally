version: 2

# Atmosphere packages (.meteor/packages) are NOT covered — Dependabot has no
# Meteor ecosystem. Keep using `meteor list` / `meteor update` by hand for those.
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    groups:
      dev-dependencies:
        dependency-type: development
      production-dependencies:
        dependency-type: production

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']
