version: 2

# Atmosphere packages (.meteor/packages) are NOT covered — Dependabot has no
# Meteor ecosystem. Keep using `meteor list` / `meteor update` by hand for those.
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    # Rspack 2 breaks `meteor build`: Meteor's own glue package
    # (@meteorjs/rspack) still emits `meteor/<package>` externals as bare
    # identifiers under it, so the server bundle fails to parse
    # ("const quave_synced_cron_namespaceObject = meteor/quave:synced-cron;").
    # Nothing in rspack.config.js can fix that — the externals are Meteor's.
    # Drop these two entries once @meteorjs/rspack supports Rspack 2.
    ignore:
      - dependency-name: '@rspack/cli'
        update-types: ['version-update:semver-major']
      - dependency-name: '@rspack/core'
        update-types: ['version-update:semver-major']
      # TypeScript 7 is the native compiler and typescript-eslint pins `<6.1.0`; the app
      # follows typescript-eslint. Drop when it accepts 7.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    groups:
      dev-dependencies:
        dependency-type: development
      production-dependencies:
        dependency-type: production

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']
